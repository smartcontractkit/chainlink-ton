name: TON - Contracts - Test

on:
  pull_request:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ton_changes: ${{ steps.changes.outputs.ton_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          list-files: "shell"
          filters: |
            ton_changes:
              - 'contracts/**'
              - '.github/workflows/contracts-test.yml'

  test:
    name: Test contracts
    needs: [ changes ]
    if: ${{ needs.changes.outputs.ton_changes == 'true' }}
    runs-on: ubuntu-latest

    steps:
     - name: Check out code
       uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
       with:
         fetch-depth: 0

     - name: Install Nix
       uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
       with:
         nix_path: nixpkgs=channel:nixos-unstable

     - name: Build (yarn)
       run: |
         set -euo pipefail
         pushd contracts
         nix develop .#contracts -c yarn && yarn build
         popd

     - name: Run tests
       run: |
         set -euo pipefail
         pushd contracts
         nix develop .#contracts -c  yarn test
         popd



