name: TON - Deployment module checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build contracts
        run: |
          nix develop .#contracts -c yarn
          nix develop .#contracts -c yarn build
        working-directory: contracts

      - name: Diagnose deployment module resolution
        working-directory: deployment
        run: |
          pwd
          git rev-parse HEAD
          go env GOMOD GOWORK GOFLAGS
          go list -m -json github.com/smartcontractkit/chainlink-ton
          ls -la ../pkg/ccip/bindings/rmnremote
          go list -json github.com/smartcontractkit/chainlink-ton/pkg/ccip/bindings/rmnremote

      - name: Run build
        run: nix develop -c go build -v ./...
        working-directory: deployment

      - name: Run unit tests
        run: nix develop -c go test -v -count=1 -p=1 ./...
        working-directory: deployment
