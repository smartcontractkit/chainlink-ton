name: Staging - CCIP Messaging Tests
permissions:
  contents: read

on:
  schedule:
    # Runs at minute 0, 15, 30, and 45 of every hour
    - cron: "*/15 * * * *"

  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - jade/ci-staging-evm2ton

jobs:
  messaging-tests:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-staging-messaging-test'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        direction: [ton2evm, evm2ton]
    env:
      TON_TESTNET_SELECTOR: ${{ vars.TON_TESTNET_SELECTOR }}
      ETHEREUM_TESTNET_SEPOLIA_SELECTOR: ${{ vars.ETHEREUM_TESTNET_SEPOLIA_SELECTOR }}
      TON_TESTNET_ROUTER: ${{ secrets.STAGING_TON_TESTNET_ROUTER }}
      TON_TESTNET_RECEIVER: ${{ secrets.STAGING_TON_TESTNET_RECEIVER }}
      TON_TESTNET_WALLET_KEY: ${{ secrets.STAGING_TON_TESTNET_WALLET_KEY }}
      TON_TESTNET_ENDPOINT: ${{ secrets.STAGING_TON_TESTNET_ENDPOINT }}
      ETHEREUM_TESTNET_SEPOLIA_ROUTER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ROUTER }}
      ETHEREUM_TESTNET_SEPOLIA_RECEIVER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_RECEIVER }}
      ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY }}
      ETHEREUM_TESTNET_SEPOLIA_ENDPOINT: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ENDPOINT }}
      MESSAGE: "ccip-staging-${{ github.run_id }}-${{ matrix.direction }}"
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      TRIGGER: "${{ github.event_name }}"
    steps:
      - name: Check out code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run ${{ matrix.direction }} test
        id: test
        run: |
          cd staging-messaging-test
          nix develop -c ./run_test.sh ${{ matrix.direction }}

      - name: Send Slack notification (success)
        if: success()
        run: |
          DIRECTION=$(echo "${{ matrix.direction }}" | tr '[:lower:]' '[:upper:]' | sed 's/2/ → /')
          SRC_ROUTER="${{ matrix.direction == 'ton2evm' && secrets.STAGING_TON_TESTNET_ROUTER || secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ROUTER }}"
          DEST_RECEIVER="${{ matrix.direction == 'ton2evm' && secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_RECEIVER || secrets.STAGING_TON_TESTNET_RECEIVER }}"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"Status\": \":white_check_mark: Success - CCIP ${DIRECTION}\",
              \"Router\": \"${SRC_ROUTER}\",
              \"Receiver\": \"${DEST_RECEIVER}\",
              \"Data\": \"${{ env.MESSAGE }}\",
              \"RunURL\": \"${RUN_URL}\",
              \"Trigger\": \"${TRIGGER}\",
            }" \
            ${{ secrets.STAGING_TEST_SLACK_WEBHOOK }}

      - name: Send Slack notification (failure)
        if: failure()
        run: |
          DIRECTION=$(echo "${{ matrix.direction }}" | tr '[:lower:]' '[:upper:]' | sed 's/2/ → /')
          SRC_ROUTER="${{ matrix.direction == 'ton2evm' && secrets.STAGING_TON_TESTNET_ROUTER || secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ROUTER }}"
          DEST_RECEIVER="${{ matrix.direction == 'ton2evm' && secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_RECEIVER || secrets.STAGING_TON_TESTNET_RECEIVER }}"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"Status\": \":x: Failure - CCIP ${DIRECTION}\",
              \"Router\": \"${SRC_ROUTER}\",
              \"Receiver\": \"${DEST_RECEIVER}\",
              \"Data\": \"${{ env.MESSAGE }}\",
              \"RunURL\": \"${RUN_URL}\",
              \"Trigger\": \"${TRIGGER}\",
            }" \
            ${{ secrets.STAGING_TEST_SLACK_WEBHOOK }}
