name: Staging - CCIP Messaging Tests
permissions:
  contents: read

on:
  schedule:
    # Runs at minute 0, 15, 30, and 45 of every hour
    - cron: "*/15 * * * *"

  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

jobs:
  messaging-tests:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-staging-messaging-test'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [ton2evm, evm2ton]
    env:
      TON_TESTNET_SELECTOR: ${{ vars.TON_TESTNET_SELECTOR }}
      ETHEREUM_TESTNET_SEPOLIA_SELECTOR: ${{ vars.ETHEREUM_TESTNET_SEPOLIA_SELECTOR }}
      TON_TESTNET_ROUTER: ${{ secrets.STAGING_TON_TESTNET_ROUTER }}
      TON_TESTNET_RECEIVER: ${{ secrets.STAGING_TON_TESTNET_RECEIVER }}
      TON_TESTNET_WALLET_KEY: ${{ secrets.STAGING_TON_TESTNET_WALLET_KEY }}
      TON_TESTNET_ENDPOINT: ${{ secrets.STAGING_TON_TESTNET_ENDPOINT }}
      ETHEREUM_TESTNET_SEPOLIA_ROUTER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ROUTER }}
      ETHEREUM_TESTNET_SEPOLIA_RECEIVER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_RECEIVER }}
      ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY }}
      ETHEREUM_TESTNET_SEPOLIA_ENDPOINT: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ENDPOINT }}
      MESSAGE: "ccip-staging-${{ github.run_id }}"
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      TRIGGER: "${{ github.event_name }}"
      WHEN: "${{ github.run_started_at }}" # ISO8601
    steps:
      - name: Check out code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run ${{ matrix.test }} test
        id: test
        run: |
          cd staging-messaging-test
          nix develop -c go run ./cmd/${{ matrix.test }} > result.json || true
          echo "=== Test Result JSON ==="
          cat result.json

      - name: Send Slack notification
        if: always()
        run: |
          cd staging-messaging-test
          
          # Extract the last JSON object (test result) from file (logs are also JSON)
          # Use jq slurp mode to read all JSON objects and take the last one
          TEST_RESULT=$(jq -s '.[-1]' result.json)
          
          # Parse result
          STATUS=$(echo "$TEST_RESULT" | jq -r '.status')
          CASE=$(echo "$TEST_RESULT" | jq -r '.case')
          ROUTER=$(echo "$TEST_RESULT" | jq -r '.router')
          RECEIVER=$(echo "$TEST_RESULT" | jq -r '.receiver')
          DATA=$(echo "$TEST_RESULT" | jq -r '.data')
          MESSAGE_ID=$(echo "$TEST_RESULT" | jq -r '.message_id // "N/A"')
          SENDER_ADDRESS=$(echo "$TEST_RESULT" | jq -r '.sender_address // "N/A"')
          SENDER_BALANCE=$(echo "$TEST_RESULT" | jq -r '.sender_balance // "N/A"')
          LATENCY=$(echo "$TEST_RESULT" | jq -r '.latency_formatted // "N/A"')
          ERROR=$(echo "$TEST_RESULT" | jq -r '.error // ""')
          
          # Set status icon
          if [[ "$STATUS" == "success" ]]; then
            STATUS_ICON=":white_check_mark: Success"
          else
            STATUS_ICON=":x: Failure"
          fi
          
          # Send webhook
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"status\": \"$STATUS_ICON\",
              \"test_case\": \"$CASE\",
              \"src_router\": \"$ROUTER\",
              \"dest_receiver\": \"$RECEIVER\",
              \"data\": \"$DATA\",
              \"message_id\": \"$MESSAGE_ID\",
              \"sender_address\": \"$SENDER_ADDRESS\",
              \"sender_balance\": \"$SENDER_BALANCE\",
              \"latency\": \"$LATENCY\",
              \"run_url\": \"${{ env.RUN_URL }}\",
              \"trigger\": \"${{ env.TRIGGER }}\",
              \"when\": \"${{ env.WHEN }}\"
            }" \
            ${{ secrets.STAGING_TEST_SLACK_WEBHOOK }}
