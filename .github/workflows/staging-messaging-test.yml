name: Staging - CCIP Messaging Tests
permissions:
  contents: read

on:
  schedule:
    # Runs at minute 0, 15, 30, and 45 of every hour
    - cron: "*/15 * * * *"

  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
      - jade/ci-staging-evm2ton

jobs:
  check-balances:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-staging-messaging-test'))
    runs-on: ubuntu-latest
    outputs:
      ton_balance: ${{ steps.ton.outputs.balance }}
      evm_balance: ${{ steps.evm.outputs.balance }}
    env:
      TON_TESTNET_SELECTOR: ${{ vars.TON_TESTNET_SELECTOR }}
      ETHEREUM_TESTNET_SEPOLIA_SELECTOR: ${{ vars.ETHEREUM_TESTNET_SEPOLIA_SELECTOR }}
      TON_TESTNET_ROUTER: ${{ secrets.STAGING_TON_TESTNET_ROUTER }}
      TON_TESTNET_RECEIVER: ${{ secrets.STAGING_TON_TESTNET_RECEIVER }}
      TON_TESTNET_WALLET_KEY: ${{ secrets.STAGING_TON_TESTNET_WALLET_KEY }}
      TON_TESTNET_ENDPOINT: ${{ secrets.STAGING_TON_TESTNET_ENDPOINT }}
      ETHEREUM_TESTNET_SEPOLIA_ROUTER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ROUTER }}
      ETHEREUM_TESTNET_SEPOLIA_RECEIVER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_RECEIVER }}
      ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY }}
      ETHEREUM_TESTNET_SEPOLIA_ENDPOINT: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ENDPOINT }}
    steps:
      - name: Check out code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check TON balance
        id: ton
        run: |
          cd staging-messaging-test
          BALANCE=$(nix develop -c go run ./cmd/check_balance "$TON_TESTNET_SELECTOR" "$TON_TESTNET_ROUTER" | jq -r '.balance')
          echo "balance=$BALANCE" >> $GITHUB_OUTPUT
          echo "TON Balance: $BALANCE"

      - name: Check EVM balance
        id: evm
        run: |
          cd staging-messaging-test
          # Get wallet address from private key
          WALLET_ADDR=$(nix develop -c go run ./cmd/check_balance "$ETHEREUM_TESTNET_SEPOLIA_SELECTOR" "$ETHEREUM_TESTNET_SEPOLIA_ROUTER" | jq -r '.balance')
          echo "balance=$WALLET_ADDR" >> $GITHUB_OUTPUT
          echo "EVM Balance: $WALLET_ADDR"

  messaging-tests:
    needs: check-balances
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-staging-messaging-test'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        direction: [ton2evm, evm2ton]
    env:
      TON_TESTNET_SELECTOR: ${{ vars.TON_TESTNET_SELECTOR }}
      ETHEREUM_TESTNET_SEPOLIA_SELECTOR: ${{ vars.ETHEREUM_TESTNET_SEPOLIA_SELECTOR }}
      TON_TESTNET_ROUTER: ${{ secrets.STAGING_TON_TESTNET_ROUTER }}
      TON_TESTNET_RECEIVER: ${{ secrets.STAGING_TON_TESTNET_RECEIVER }}
      TON_TESTNET_WALLET_KEY: ${{ secrets.STAGING_TON_TESTNET_WALLET_KEY }}
      TON_TESTNET_ENDPOINT: ${{ secrets.STAGING_TON_TESTNET_ENDPOINT }}
      ETHEREUM_TESTNET_SEPOLIA_ROUTER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ROUTER }}
      ETHEREUM_TESTNET_SEPOLIA_RECEIVER: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_RECEIVER }}
      ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_WALLET_KEY }}
      ETHEREUM_TESTNET_SEPOLIA_ENDPOINT: ${{ secrets.STAGING_ETHEREUM_TESTNET_SEPOLIA_ENDPOINT }}
      MESSAGE: "ccip-staging-${{ github.run_id }}-${{ matrix.direction }}"
    steps:
      - name: Check out code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run ${{ matrix.direction }} test
        id: test
        run: |
          cd staging-messaging-test
          nix develop -c ./run_test.sh ${{ matrix.direction }}

      - name: Send Slack notification
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi
          
          DIRECTION=$(echo "${{ matrix.direction }}" | tr '[:lower:]' '[:upper:]' | sed 's/2/ → /')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"${STATUS}: CCIP ${DIRECTION}\",
              \"blocks\": [
                {\"type\": \"header\", \"text\": {\"type\": \"plain_text\", \"text\": \"${STATUS}: CCIP ${DIRECTION}\"}},
                {\"type\": \"section\", \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*Trigger:* ${{ github.event_name }}\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*Message:* \\\`${{ env.MESSAGE }}\\\`\"}
                ]},
                {\"type\": \"section\", \"fields\": [
                  {\"type\": \"mrkdwn\", \"text\": \"*TON:* \\\`${{ needs.check-balances.outputs.ton_balance }}\\\`\"},
                  {\"type\": \"mrkdwn\", \"text\": \"*EVM:* \\\`${{ needs.check-balances.outputs.evm_balance }}\\\`\"}
                ]},
                {\"type\": \"context\", \"elements\": [{\"type\": \"mrkdwn\", \"text\": \"<${RUN_URL}|View Logs>\"}]}
              ]
            }" \
            "${{ secrets.STAGING_TEST_SLACK_WEBHOOK }}"
