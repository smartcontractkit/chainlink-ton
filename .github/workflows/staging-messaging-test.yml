name: Staging TON2EVM messaging test

on:
  schedule:
    # Runs at minute 0, 15, 30, and 45 of every hour
    - cron: "*/15 * * * *"

  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

jobs:
  messaging-test:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-staging-ton2evm-test'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run TON2EVM messaging test
        env:
          TON_ROUTER_ADDRESS: ${{ secrets.STAGING_TON_ROUTER_ADDRESS }}
          EVM_DEST_CHAIN_SELECTOR: ${{ secrets.STAGING_SEPOLIA_DEST_CHAIN_SELECTOR }}
          EVM_RECEIVER_ADDRESS: ${{ secrets.STAGING_EVM_RECEIVER_ADDRESS }}
          CCIP_MESSAGE: "hello-ton->evm-${{ github.run_id }}"
          TON_SENDER_WALLET_SEED_PHRASE: ${{ secrets.STAGING_TEST_SENDER_WALLET_SEED }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          pushd staging-messaging-test
          eval "$(nix print-dev-env .#)"
          nix develop -c go test
          popd
