name: TON - Execute Report Golden BOC

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    golden-boc:
        name: Verify Execute Report Golden BOC
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v5

            - name: Install Nix
              uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
              with:
                  nix_path: nixpkgs=channel:nixos-unstable

            - name: Build legacy execute-report CLI
              run: |
                  # Set TMPDIR to a writable dir; Go build temp-file cleanup can fail
                  # in the Nix sandbox otherwise.
                  export TMPDIR="$RUNNER_TEMP"
                  nix develop -c go build -o /tmp/legacy-execute-report .
              working-directory: cciplib/ccip/bindings/ocr/testdata/legacyexecutereport

            - name: Regenerate golden BOC from JSON fixture
              run: |
                  /tmp/legacy-execute-report encode \
                    -input testdata/golden/execute_report.json \
                    -output testdata/golden/execute_report.boc

            - name: Assert golden BOC was not mutated
              run: |
                  git add testdata/golden/execute_report.boc
                  if ! git diff --minimal --cached --exit-code; then
                    echo "::error::The committed golden BOC (testdata/golden/execute_report.boc) does not match the BOC regenerated by the legacy binding from testdata/golden/execute_report.json."
                    echo "This means the current binding would produce a different bag of cells than the legacy binding for a tokenless report."
                    echo "Run the legacy CLI locally to regenerate the golden BOC and commit the result:"
                    echo "  cd cciplib/ccip/bindings/ocr/testdata/legacyexecutereport"
                    echo "  go build -o /tmp/legacy-execute-report ."
                    echo "  /tmp/legacy-execute-report encode -input testdata/golden/execute_report.json -output testdata/golden/execute_report.boc"
                    exit 1
                  fi
