name: TON - Relayer - Publish Docker Image PoC II

on:
  push:
    branches:
      - chores-release-process
  pull_request:
    types: [labeled, opened, synchronize, reopened]  # Trigger when a label is added
  workflow_dispatch: # Manual trigger from GitHub UI

env:
  CHAINLINK_PUBLIC_ECR_IMAGE: public.ecr.aws/chainlink/chainlink
  

jobs:
  build-or-get-core:
    name: Build or Get Chainlink Core Base Image
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_CACHE_DIR: ${{ github.workspace }}/.cache
      DOCKER_CACHE_KEY_SHA: ccip-chainlink-core-sha-cache-v1
      DOCKER_CACHE_KEY_NON_SHA: ccip-chainlink-core-non-sha-cache-v1
      DOCKER_CACHE_TAR_NAME_SHA: ccip-chainlink-core-sha-cache.tar
      DOCKER_CACHE_TAR_NAME_NON_SHA: ccip-chainlink-core-non-sha-cache.tar
    outputs:
      base_image: ${{ steps.determine-base-image.outputs.BASE_IMAGE }}
    steps:
      - name: Setup GitHub token using GATI
        id: set-token
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/1.0.0
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN_GATI_READONLY }}
          aws-lambda-url: ${{ secrets.AWS_LAMBDA_URL_GATI }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-role-duration-seconds: "1800"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_PUBLISH_ARN_STAGING }}
          role-duration-seconds: 3600
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          mask-password: "true"
          registries: "${{ secrets.AWS_ACCOUNT_ID_STAGING}}"

      - name: Checkout chainlink-ton Repository
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4

      - name: Prepare Cache Dir
        run: mkdir -p ${{ env.DOCKER_CACHE_DIR }}

      - name: Read Chainlink Core Ref from .core_version File
        id: read_core_ref
        run: echo "CORE_REF=$(cat ./scripts/.core_version | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Detect if CORE_REF is a SHA
        id: detect_core_ref_is_sha
        run: |
          REF="${{ steps.read_core_ref.outputs.CORE_REF }}"
          if [[ "$REF" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "is_sha=true" >> $GITHUB_OUTPUT
          else
            echo "is_sha=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Determine Base Image Name
        id: determine-base-image
        run: |
          if [[ "${{ steps.detect_core_ref_is_sha.outputs.is_sha }}" == "true" ]]; then
            echo "BASE_IMAGE=${{ secrets.AWS_ACCOUNT_ID_STAGING}}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/chainlink_ton_core_local:${{ steps.read_core_ref.outputs.CORE_REF }}" >> $GITHUB_OUTPUT
          else
            echo "BASE_IMAGE=${{ env.CHAINLINK_PUBLIC_ECR_IMAGE }}:${{ steps.read_core_ref.outputs.CORE_REF }}" >> $GITHUB_OUTPUT
          fi

      - name: Debug
        id: debug
        run: |
          echo "BASE_IMAGE=$BASE_IMAGE"
          docker images

      - name: Restore Docker Images from Cache When Core Image Ref Is a SHA
        if: steps.detect_core_ref_is_sha.outputs.is_sha == 'true'
        id: restore-cache-images-sha
        uses: actions/cache@v4
        with:
          path: ${{ env.DOCKER_CACHE_DIR }}/${{ steps.read_core_ref.outputs.CORE_REF }}-${{ env.DOCKER_CACHE_TAR_NAME_SHA }}
          key: ${{ env.DOCKER_CACHE_KEY_SHA }}-${{ steps.read_core_ref.outputs.CORE_REF }}

      - name: Load Docker Images From Cache When Core Image Ref Is a SHA
        if: steps.restore-cache-images-sha.outputs.cache-hit == 'true'
        run: |
          echo "Cache hit for key '${{ env.DOCKER_CACHE_KEY_SHA }}-${{ steps.read_core_ref.outputs.CORE_REF }}'. Loading images with sha from tarball..."
          docker load -i ${{ env.DOCKER_CACHE_DIR }}/${{ steps.read_core_ref.outputs.CORE_REF }}-${{ env.DOCKER_CACHE_TAR_NAME_SHA }}

      - name: Debug
        id: debug-2
        run: |
          docker images

      - name: Restore Docker Images from Cache When Core Image Ref Is Not a SHA
        if: steps.detect_core_ref_is_sha.outputs.is_sha == 'false'
        id: restore-cache-images-non-sha
        uses: actions/cache@v4
        with:
          path: ${{ env.DOCKER_CACHE_DIR }}/${{ steps.read_core_ref.outputs.CORE_REF }}-${{ env.DOCKER_CACHE_TAR_NAME_NON_SHA }}
          key: ${{ env.DOCKER_CACHE_KEY_NON_SHA }}-${{ steps.read_core_ref.outputs.CORE_REF }}

      - name: Load Docker Images From Cache When Core Image Ref Is Not a SHA
        if: steps.restore-cache-images-non-sha.outputs.cache-hit == 'true'
        run: |
          echo "Cache hit for key '${{ env.DOCKER_CACHE_KEY_NON_SHA }}-${{ steps.read_core_ref.outputs.CORE_REF }}'. Loading images with non-sha from tarball..."
          docker load -i ${{ env.DOCKER_CACHE_DIR }}/${{ steps.read_core_ref.outputs.CORE_REF }}-${{ env.DOCKER_CACHE_TAR_NAME_NON_SHA }}

      - name: Pull & Save Image on Cache Miss When Core Ref Is Not a SHA
        if: steps.detect_core_ref_is_sha.outputs.is_sha == 'false' && steps.restore-cache-images-non-sha.outputs.cache-hit != 'true'
        run: |
          echo "Cache Miss: Pulling chainlink core image from ${{ steps.determine-base-image.outputs.BASE_IMAGE }}"
          docker pull ${{ steps.determine-base-image.outputs.BASE_IMAGE }}

          echo "Saving to tarball…"
          docker save ${{ steps.determine-base-image.outputs.BASE_IMAGE }} \
            -o ${{ env.DOCKER_CACHE_DIR }}/${{ steps.read_core_ref.outputs.CORE_REF }}-${{ env.DOCKER_CACHE_TAR_NAME_NON_SHA }}

      - name: Check if There Is A Core Image Already Built for This SHA
        if: steps.detect_core_ref_is_sha.outputs.is_sha == 'true' && steps.restore-cache-images-sha.outputs.cache-hit != 'true'
        id: check-if-image-is-available
        run: |
          if docker image inspect ${{ steps.determine-base-image.outputs.BASE_IMAGE }} > /dev/null 2>&1; then 
            echo "Cache Hit: Using existing image ${{ steps.determine-base-image.outputs.BASE_IMAGE }}"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Checking if Chainlink Core image exist or we need to built it"

            if docker pull ghcr.io/myorg/myimage:latest; then
              echo "Chainlink Core image ${{ steps.determine-base-image.outputs.BASE_IMAGE }} exist in the ECR. We can use it in the build step"
              echo "Saving Chainlink Core image to tarball…"

              docker save ${{ steps.determine-base-image.outputs.BASE_IMAGE }} \
                -o ${{ env.DOCKER_CACHE_DIR }}/${{ steps.read_core_ref.outputs.CORE_REF }}-${{ env.DOCKER_CACHE_TAR_NAME_NON_SHA }}

              echo "exists=true" >> $GITHUB_OUTPUT
            else
              echo "Chainlink Core image ${{ steps.determine-base-image.outputs.BASE_IMAGE }} does not exist in the ECR. We need to built it."
              echo "exists=false" >> $GITHUB_OUTPUT
            fi
          fi

      # - name: Checkout Chainlink Core repo
      #   if: steps.detect_core_ref_is_sha.outputs.is_sha == 'true' && steps.check-if-image-is-available.outputs.exists == 'false'
      #   id: checkout-core
      #   uses: actions/checkout@v4
      #   with:
      #     repository: smartcontractkit/chainlink
      #     ref: ${{ steps.read_core_ref.outputs.CORE_REF }}
      #     path: temp/chainlink

      # - name: Build Chainlink Image
      #   if: steps.detect_core_ref_is_sha.outputs.is_sha == 'true' && steps.check-if-image-is-available.outputs.exists == 'false'
      #   id: build-core
      #   env:
      #     GIT_AUTH_TOKEN: ${{ steps.set-token.outputs.access-token }}
      #   run: |
      #     cd temp/chainlink

      #     echo "🔎 Building from commit: $(git rev-parse HEAD)"
      #     echo "🔎 Commit message: $(git log -1 --pretty=%B)"
      #     echo "🔎 Branch: $(git rev-parse --abbrev-ref HEAD)"
      #     echo "🔎 Dockerfile: plugins/chainlink.Dockerfile"
      #     echo "🔎 Build context: $(pwd)"
      #     ls -sa

      #     docker buildx build \
      #       --secret id=GIT_AUTH_TOKEN \
      #       --build-arg COMMIT_SHA=$(git rev-parse HEAD) \
      #       -t ${{ steps.determine-base-image.outputs.BASE_IMAGE }} \
      #       -f plugins/chainlink.Dockerfile .
      
      - name: Debug
        id: debug-3
        run: |
          docker images

      # - name: Save the Core Image Just Built
      #   if: steps.detect_core_ref_is_sha.outputs.is_sha == 'true' && steps.check-if-image-is-available.outputs.exists == 'false'
      #   run: |
      #     echo "Saving to tarball…"
      #     docker save ${{ steps.determine-base-image.outputs.BASE_IMAGE }} \
      #       -o ${{ env.DOCKER_CACHE_DIR }}/${{ steps.read_core_ref.outputs.CORE_REF }}-${{ env.DOCKER_CACHE_TAR_NAME_NON_SHA }}

