name: Run TON Smoke Tests

on:
  push:
    branches:
    - main
  pull_request:
  schedule:
    - cron: '0 3 * * *'       # runs each night at 03:00 UTC

jobs:
  run-ton-smoke-tests:
    name: Run TON Smoke Tests in Chainlink CCIP
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
    - name: Set Chainlink version
      id: set-version
      run: |
        # Default to the pinned version for PRs
        CHAINLINK_VERSION="80e09da8e48b1d52534530a7882dffffae0858db" # Dec 30, 2025

        # If this is a scheduled (nightly) run, switch to develop
        if [[ "${{ github.event_name }}" == "schedule" ]]; then
            CHAINLINK_VERSION="develop"
        fi

        echo "chainlink_version=$CHAINLINK_VERSION" >> "$GITHUB_OUTPUT"
    - name: Setup GitHub Token
      id: setup-github-token
      uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/1.0.0
      with:
        aws-role-arn: ${{ secrets.AWS_ROLE_ARN_WORKFLOWS_CHAINLINKCCIP }}
        aws-lambda-url: ${{ secrets.AWS_LAMBDA_URL_GATI_CHAINLINKCCIP }}
        aws-region: ${{ vars.AWS_REGION }}
        aws-role-duration-seconds: "1800"
    - name: Trigger Chainlink CCIP TON Smoke Tests
      env:
        GH_TOKEN: ${{ steps.setup-github-token.outputs.access-token }}
        # Deployment configuration
        WORKFLOW_FILE: .github/workflows/test_smoke.yml
        TARGET_REPO: smartcontractkit/chainlink-ccip
        TARGET_BRANCH: tt/ton
        TON_REF: ${{ github.head_ref || github.sha }}
        CHAINLINK_VERSION: ${{steps.set-version.outputs.chainlink_version}}
        # relative to chainlink-ccip/devenv. Assumes chainlink-ton is checked out to top level
        CUSTOM_CONFIG: env.toml,env-cl-rebuild-ci.toml,../chainlink-ton/devenv-impl/ton.toml
        CONTRACT_VERSION: 99dca5448b92 #todo: allow to use local
      run: |
        set -euo pipefail
        POLL_INTERVAL=5   # seconds between successive polls
        MAX_ATTEMPTS=120  # stop after ~10 minutes (adjust as needed)
        fetch_latest() {
          gh run list \
          --repo "${TARGET_REPO}" \
          --workflow test_smoke.yml \
          --branch "${TARGET_BRANCH}" \
          --status in_progress \
          --json databaseId \
          --limit 1 \
          --jq '.[0].databaseId'
        }
        gh workflow run "${WORKFLOW_FILE}" \
        --repo "${TARGET_REPO}" \
        --ref "${TARGET_BRANCH}" \
        --field "ton_ref=${TON_REF}" \
        --field "chainlink_version=${CHAINLINK_VERSION}" \
        --field "contract_version=${CONTRACT_VERSION}" \
        --field "custom_config=${CUSTOM_CONFIG}"
        
        prev_id="$(fetch_latest)"   # initial snapshot (may be empty)
        attempt=0

        while (( attempt < MAX_ATTEMPTS )); do
          ((attempt++))
          sleep "$POLL_INTERVAL"

          cur_id="$(fetch_latest)"

          # If the id changed, we have a new run
          # Note: this simple logic assumes only one new run can appear during the polling period
          # so we don't actually know which ID is ours
          if [[ "$cur_id" != "$prev_id" ]]; then
            echo "New in‑progress run detected: databaseId=$cur_id"
            echo "Starting watch…"
            gh run watch --repo "$TARGET_REPO" "$cur_id"
            exit 0
          fi

          # Keep the last snapshot for the next iteration
          prev_id="$cur_id"
        done

        echo "Timeout reached – no new in‑progress run appeared."
        exit 1
