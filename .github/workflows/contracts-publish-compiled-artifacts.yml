name: TON - Publish contract artifacts release

# This is a custom temporary solution to get the contract build artifacts on other repos and workflows

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish a GitHub release on this manual run?"
        type: boolean
        default: false
        required: false
      sha:
        description: "Commit SHA to build/release (optional)"
        type: string
        required: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ton_changes: ${{ steps.compute.outputs.ton_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Detect changes (paths)
        id: paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          list-files: "shell"
          filters: |
            ton_changes:
              - 'contracts/**'
              - '.github/workflows/contracts-build.yml'

      - name: Compute ton_changes
        id: compute
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]] && \
             [[ "${{ contains(github.event.pull_request.labels.*.name, 'build-publish-contracts') }}" == "true" ]]; then
            echo "ton_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "ton_changes=${{ steps.paths.outputs.ton_changes }}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build Nix pkg and publish tarball
    needs: [ changes ]
    if: |
      needs.changes.outputs.ton_changes == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-publish-contracts'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get Long and Short SHAs
        id: get_sha
        run: |
          set -euo pipefail
          TARGET_SHA="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sha != '' && github.event.inputs.sha || github.sha }}"
          FULL_SHA="$(git rev-parse "${TARGET_SHA}")"
          {
            echo "short_sha=${FULL_SHA:0:12}"
            echo "full_sha=${FULL_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Detect package version and release signal
        id: version_check
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(jq -r '.version' contracts/package.json)"

          # A release is signalled by a version bump in contracts/package.json.
          # For push-to-main: compare with the previous commit.
          # For workflow_dispatch: honour the create_release input explicitly.
          # For pull_request and other events: never a release.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            PREV_VERSION="$(git show HEAD~1:contracts/package.json | jq -r '.version' 2>/dev/null || echo '')"
            if [[ "$CURRENT_VERSION" != "$PREV_VERSION" ]]; then
              IS_RELEASE="true"
            else
              IS_RELEASE="false"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IS_RELEASE="${{ github.event.inputs.create_release }}"
          else
            IS_RELEASE="false"
          fi

          echo "version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${CURRENT_VERSION}, is_release: ${IS_RELEASE}"

      - name: Install Nix
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build contracts (Nix) and capture out path
        id: nix_build
        run: |
          set -euo pipefail
          OUT_PATH="$(nix build --print-out-paths .#contracts)"
          echo "out_path=${OUT_PATH}" >> "$GITHUB_OUTPUT"
          echo "Nix out path: ${OUT_PATH}"

      - name: Stage build and set contracts-pkg.json version
        id: stage
        run: |
          set -euo pipefail
          BUILD_DIR="${{ steps.nix_build.outputs.out_path }}/lib/node_modules/@chainlink/contracts-ton/build"
          test -d "${BUILD_DIR}" # hard fail if layout changes

          # Nix store is read-only; copy to a writable staging directory.
          STAGING_DIR="$(mktemp -d)"
          cp -r "${BUILD_DIR}/." "${STAGING_DIR}/"

          # Determine the package version to embed in contracts-pkg.json.
          # Releases use the clean version from package.json; all other builds append
          # the short SHA as semver build metadata so consumers can tell them apart.
          PKG_VERSION="${{ steps.version_check.outputs.version }}"
          if [[ "${{ steps.version_check.outputs.is_release }}" != "true" ]]; then
            PKG_VERSION="${PKG_VERSION}+${{ steps.get_sha.outputs.short_sha }}"
          fi

          # Patch the package version in contracts-pkg.json.
          # Individual contract versions (written by the build from Tolk sources) stay untouched.
          jq --arg v "${PKG_VERSION}" '.version = $v' \
            "${STAGING_DIR}/contracts-pkg.json" > "${STAGING_DIR}/contracts-pkg.json.tmp"
          mv "${STAGING_DIR}/contracts-pkg.json.tmp" "${STAGING_DIR}/contracts-pkg.json"

          echo "staging_dir=${STAGING_DIR}" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "contracts-pkg.json package version: ${PKG_VERSION}"

      - name: Package contracts tarball
        id: package
        run: |
          set -euo pipefail
          mkdir -p dist
          TAR_NAME="ton-contracts-build-${{ steps.get_sha.outputs.short_sha }}.tar.gz"
          tar -C "${{ steps.stage.outputs.staging_dir }}" \
              --exclude="examples.*" \
              -czf "dist/${TAR_NAME}" .
          echo "tar_path=dist/${TAR_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ton-contracts-build-${{ steps.get_sha.outputs.short_sha }}
          path: ${{ steps.package.outputs.tar_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish Release
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.version_check.outputs.is_release == 'true') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: contracts/${{ steps.version_check.outputs.version }}
          target_commitish: ${{ steps.get_sha.outputs.full_sha }}
          name: TON Contracts ${{ steps.version_check.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.tar_path }}
