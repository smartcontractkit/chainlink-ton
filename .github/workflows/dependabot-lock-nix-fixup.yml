name: TON - Dependabot lock.nix fixup

# Dependabot bumps go stale in lock.nix; PR CI then dies with "hash mismatch
# in fixed-output derivation". This workflow self-heals: it runs main's
# `lock-nix-tidy` over the PR head and commits the fix as a GitHub App, so the
# same checks re-run and go green.
#
# GATI is not cosmetic — GITHUB_TOKEN is read-only for Dependabot PRs, and only
# an App-token push re-triggers the checks that turn the PR green.
#
# Three triggers:
#   workflow_run      automatic. A watched workflow went red; acts on Dependabot
#                     PRs only, and skips other authors quietly.
#   nix-tidy label    on demand. Apply to any PR; consumed automatically, so
#                     re-apply to retry.
#   workflow_dispatch on demand, any PR. Unlike the label this keeps secrets,
#                     so it is the route for Dependabot PRs and retries.
#
# Ops: the watch fails silently — a long-red Dependabot PR means a look at this
# workflow's runs. Label "nix-tidy-skip" = the fixup ran but the red has another
# cause; retry via dispatch.

on:
  workflow_run:
    workflows:
      - "TON - Build Relayer Package"
      - "TON - Contracts"
    types:
      - completed
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR to tidy (any author, including Dependabot)"
        required: true
        type: string

permissions: {}

concurrency:
  # One fixup per PR. The reactive path keys on the failed head SHA, which also
  # serializes the two watched workflows; the manual paths key on the PR number.
  # cancel-in-progress false: a half-pushed fixup is worse than a queued one.
  group: >-
    dependabot-lock-nix-fixup-${{
      github.event.workflow_run.head_sha
      || github.event.inputs.pr_number
      || github.event.pull_request.number
    }}
  cancel-in-progress: false

jobs:
  fixup:
    name: Fix lock.nix hashes on a red Dependabot PR
    # Two layers, deliberately:
    #   here      a cheap pre-filter on Dependabot's branch naming convention,
    #             so a red human-authored PR never starts a runner at all.
    #   in-shell  the authoritative author check, which also catches a branch
    #             that merely LOOKS like a Dependabot one.
    if: >-
      (github.event_name == 'pull_request' && github.event.label.name == 'nix-tidy')
      || github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.conclusion == 'failure'
          && startsWith(github.event.workflow_run.head_branch, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check out base branch
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve the PR and apply guards
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # A step that exits 0 ends only ITSELF — every later step still runs.
          # So "skip" must gate the rest of the job, never be a bare `exit 0`.
          #
          # The gate is default-deny: `proceed` is written exactly once, here,
          # after every guard has passed. Skip paths leave it unset, so the
          # gated steps below stay skipped.

          MANUAL="${{ github.event_name != 'workflow_run' }}"

          # A manual trigger names the PR; a workflow_run carries only the
          # failed head SHA, so resolve commit -> PR.
          if [[ ${MANUAL} == "true" ]]; then
            # Use the event rather than hardcoding the label event's PR: the
            # same expression must serve both manual triggers.
            NUM="${{ github.event.inputs.pr_number || github.event.pull_request.number }}"
          else
            NUM=$(gh api "repos/${REPO}/commits/${EVENT_SHA}/pulls" \
              --jq '.[0].number // empty') || true
            [[ -n ${NUM} ]] || { echo "::error::no PR associated with ${EVENT_SHA}"; exit 1; }
          fi

          # Every label-side API call here is best-effort: a `pull_request` run
          # gets a read-only token when the head is a fork or a Dependabot
          # branch, and a missing scope must not drown out the notices below.
          # Consuming the label stops it lingering as stale state, so a retry is
          # simply re-applying it.
          if [[ ${GITHUB_EVENT_NAME} == "pull_request" ]]; then
            gh pr edit "${NUM}" --repo "${REPO}" --remove-label nix-tidy \
              || echo "::warning::could not remove the nix-tidy label (needs issues: write)"
          fi

          gh pr view "${NUM}" --repo "${REPO}" \
            --json state,author,labels,headRefName,headRefOid,isCrossRepository,headRepositoryOwner,headRepository,commits > pr.json

          STATE=$(jq -r .state pr.json)
          [[ ${STATE} == OPEN ]] || { echo "::error::PR ${NUM} is ${STATE} (need an open PR; check the number)"; exit 1; }

          AUTHOR=$(jq -r .author.login pr.json)
          BOT=false
          [[ ${AUTHOR} == "dependabot[bot]" || ${AUTHOR} == "app/dependabot" ]] && BOT=true

          # The authoritative author check. The job-level `if` pre-filters on
          # Dependabot's branch convention, which is cheap but spoofable, so
          # confirm the author here before acting.
          if [[ ${BOT} == "false" && ${MANUAL} == "false" ]]; then
            echo "::notice::PR ${NUM} is authored by ${AUTHOR}; only Dependabot PRs self-heal. Apply the nix-tidy label to tidy."
            exit 0
          fi

          # A label run is a `pull_request` run, which gets no secrets when the
          # head is a fork or a Dependabot branch, so GATI cannot mint a token.
          if [[ ${GITHUB_EVENT_NAME} == "pull_request" ]] &&
             { [[ ${BOT} == "true" ]] || [[ "$(jq -r .isCrossRepository pr.json)" == "true" ]]; }; then
            gh pr edit "${NUM}" --repo "${REPO}" --remove-label nix-tidy || true
            echo "::notice::the nix-tidy label cannot run for a Dependabot or fork PR (no secrets on pull_request runs). Use workflow_dispatch with pr_number=${NUM}."
            exit 0
          fi

          # `[dependabot skip]` keeps Dependabot auto-updating the PR, and is
          # also the loop guard's marker, so only Dependabot PRs carry it.
          if [[ ${BOT} == "true" ]]; then
            MSG="chore(nix): update lock.nix hashes for dependency bumps [dependabot skip]"
          else
            MSG="chore(nix): update lock.nix hashes"
          fi

          # Reactive-trigger-only guards. A workflow_run is pinned to one failed
          # head SHA; a manual trigger targets the current head on purpose.
          if [[ ${MANUAL} == "false" ]]; then
            # Never act on a head older than the PR's: the newer run fires its own event.
            LIVE_SHA=$(jq -r .headRefOid pr.json)
            if [[ ${EVENT_SHA} != "${LIVE_SHA}" ]]; then
              echo "::notice::PR ${NUM} moved since the failure; not acting"
              exit 0
            fi

            # Loop guard: our push re-triggers CI. Red on our own commit means
            # stale hashes are not the (remaining) problem — stop.
            HEAD_MSG=$(jq -r '.commits[-1].messageHeadline' pr.json)
            if [[ ${HEAD_MSG} == *"[dependabot skip]"* ]]; then
              gh pr edit "${NUM}" --repo "${REPO}" --add-label nix-tidy-skip || true
              echo "::error::PR ${NUM} still red on our own fixup commit (labeled nix-tidy-skip if permitted)"
              exit 1
            fi

            if jq -e '.labels[]? | select(.name == "nix-tidy-skip")' pr.json >/dev/null; then
              echo "::notice::PR ${NUM} is labeled nix-tidy-skip; retry via workflow_dispatch or by re-applying the nix-tidy label"
              exit 0
            fi
          fi

          # Fork-based PRs keep the fix on the head repo.
          PUSH_REPO=$(jq -r --arg r "${REPO}" \
            'if .isCrossRepository then .headRepositoryOwner.login + "/" + .headRepository.name else $r end' \
            pr.json)
          {
            echo "proceed=true"
            echo "number=${NUM}"
            echo "push-repo=${PUSH_REPO}"
            echo "head-ref=$(jq -r .headRefName pr.json)"
            echo "message=${MSG}"
          } >>"${GITHUB_OUTPUT}"

      - name: Mint GitHub App token (GATI)
        if: steps.pr.outputs.proceed == 'true'
        id: setup-github-token
        uses: smartcontractkit/.github/actions/setup-github-token@setup-github-token/1.0.0
        with:
          aws-role-arn: ${{ secrets.AWS_OIDC_CHAINLINK_TON_CHANGESETS_TOKEN_ISSUER_ROLE_ARN }}
          aws-lambda-url: ${{ secrets.AWS_LAMBDA_URL_GATI_CHANGESETS }}
          aws-region: ${{ vars.AWS_REGION }}
          aws-role-duration-seconds: "1800"

      - name: Check out the PR head
        if: steps.pr.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup-github-token.outputs.access-token }}
          NUM: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The seed clone is unauthenticated: let gh sign its git requests.
          gh auth setup-git
          gh pr checkout "${NUM}" --repo "${REPO}"

      - name: Install Nix
        if: steps.pr.outputs.proceed == 'true'
        uses: cachix/install-nix-action@02a151ada4993995686f9ed4f1be7cfbb229e56f # v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Re-verify fetchers and rewrite stale hashes
        if: steps.pr.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # The tool comes from main (branches can predate current revisions);
          # nix run keeps CWD, so it audits and rewrites this checkout.
          timeout 15m nix run github:smartcontractkit/chainlink-ton/main#lock-nix-tidy

      - name: Check for a fixup
        id: diff
        if: steps.pr.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.setup-github-token.outputs.access-token }}
          REPO: ${{ github.repository }}
          NUM: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          # No diff means nothing was stale and this PR's red has another cause.
          if git diff --quiet -- '*lock.nix'; then
            gh label create nix-tidy-skip --repo "${REPO}" \
              --color "ededed" --description "lock.nix fixup tried; red has another cause" || true
            # Best-effort for the same reason as the guard step's label calls.
            gh pr edit "${NUM}" --repo "${REPO}" --add-label nix-tidy-skip \
              || echo "::warning::could not label PR ${NUM} nix-tidy-skip (needs issues: write)"
            echo "::notice::PR ${NUM}: no hash was stale; labeled nix-tidy-skip"
            echo "changed=false" >>"${GITHUB_OUTPUT}"
          else
            echo "changed=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Commit the fixup
        id: signed
        if: steps.diff.outputs.changed == 'true'
        uses: $/.github/actions/signed-commit
        with:
          token: ${{ steps.setup-github-token.outputs.access-token }}
          paths: "*lock.nix"
          repository: ${{ steps.pr.outputs.push-repo }}
          branch: ${{ steps.pr.outputs.head-ref }}
          # Built by the guard step: carries `[dependabot skip]` (which is also
          # its loop-guard marker) only for Dependabot PRs.
          message: ${{ steps.pr.outputs.message }}

      - name: Report fixup
        if: steps.diff.outputs.changed == 'true'
        env:
          COMMIT_URL: ${{ steps.signed.outputs.commit-url }}
        run: |
          echo "::notice::pushed signed lock.nix fixup ${COMMIT_URL}"
