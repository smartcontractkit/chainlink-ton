# Example usage of the top-up message resolver
# This resolver calculates the amount needed to top up a contract to a target balance
# and returns an InternalMessage to fund it.

# Example 1: Top up with raw address string
messages:
  - resolver: "codec.resolvers.amount-to-top-up-message"
    data:
      dstAddr: "UQBx...abc"  # Raw TON address string
      targetAmount: "10.5"    # Target balance in TON

# Example 2: Top up using address resolver (references deployed contract)
messages:
  - resolver: "codec.resolvers.amount-to-top-up-message"
    data:
      dstAddr:
        resolver: "codec.resolvers.address-ref-to-ton-addr"
        data:
          type: "Router"       # Contract type from deployment state
          qualifier: ""         # Optional qualifier
      targetAmount: "10.5"      # Target balance in TON

# Example 3: Top up multiple contracts in one operation
messages:
  - resolver: "codec.resolvers.amount-to-top-up-message"
    data:
      dstAddr:
        resolver: "codec.resolvers.address-ref-to-ton-addr"
        data:
          type: "OnRamp"
      targetAmount: "5.0"
  - resolver: "codec.resolvers.amount-to-top-up-message"
    data:
      dstAddr:
        resolver: "codec.resolvers.address-ref-to-ton-addr"
        data:
          type: "OffRamp"
      targetAmount: "5.0"
  - resolver: "codec.resolvers.amount-to-top-up-message"
    data:
      dstAddr:
        resolver: "codec.resolvers.address-ref-to-ton-addr"
        data:
          type: "FeeQuoter"
      targetAmount: "3.0"

# How it works:
# 1. The resolver registry first resolves nested address resolvers (if used)
# 2. The top-up resolver receives the address (as string after JSON round-trip)
# 3. It queries the current balance of the contract
# 4. It calculates: amountToSend = max(0, targetAmount - currentBalance)
# 5. It returns an InternalMessage with the calculated amount
# 6. The send-messages operation sends the message to fund the contract

# Note: If currentBalance >= targetAmount, amountToSend will be 0 (no transfer)
